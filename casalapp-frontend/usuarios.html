<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários - Casal App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Casal App</span>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="casas.html">Casas</a></li>
                <li class="nav-item"><a class="nav-link active" href="usuarios.html">Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="categorias.html">Categorias</a></li>
                <li class="nav-item"><a class="nav-link" href="transacoes.html">Transações</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Usuários</h1>

        <form id="form-usuario" class="row g-2 mb-4">
            <input type="hidden" id="usuario-id">
            <div class="col-auto">
                <input type="text" id="usuario-nome" class="form-control" placeholder="Nome" required>
            </div>
            <div class="col-auto">
                <input type="email" id="usuario-email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-auto">
                <input type="password" id="usuario-senha" class="form-control" placeholder="Senha">
            </div>
            <div class="col-auto">
                <select id="usuario-casa" class="form-select" required>
                    <option value="">Selecione a casa</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="button" id="btn-cancelar" class="btn btn-secondary d-none">Cancelar edição</button>
            </div>
            <div class="col-12">
                <small id="dica-senha" class="text-muted d-none">Deixe a senha em branco para não alterá-la.</small>
            </div>
        </form>

        <table class="table table-bordered bg-white">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Casa</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-usuarios"></tbody>
        </table>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api/casaApi.js"></script>
    <script src="js/api/usuarioApi.js"></script>
    <script src="js/pages/usuarios.js"></script>
</body>
</html>
