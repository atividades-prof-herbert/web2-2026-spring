<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Casal App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Casal App</span>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                <li class="nav-item"><a class="nav-link" href="casas.html">Casas</a></li>
                <li class="nav-item"><a class="nav-link" href="usuarios.html">Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="categorias.html">Categorias</a></li>
                <li class="nav-item"><a class="nav-link" href="transacoes.html">Transações</a></li>
                <li class="nav-item"><a class="nav-link active" href="login.html">Entrar</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Entrar</h1>

        <form id="form-login" class="row g-2 mb-4">
            <div class="col-auto">
                <input type="email" id="login-email" class="form-control" placeholder="Email" required>
            </div>
            <div class="col-auto">
                <input type="password" id="login-senha" class="form-control" placeholder="Senha" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>

        <div id="login-erro" class="alert alert-danger d-none"></div>

        <div id="painel-logado" class="alert alert-success d-none">
            <p class="mb-1">Autenticado como <strong id="nome-logado"></strong>, da casa <strong id="casa-logada"></strong>.</p>
            <p class="mb-2 small">Quem respondeu quem você é foi o servidor, em <code>GET /auth/eu</code>, a partir do token guardado no <code>localStorage</code>: recarregar o navegador não desfaz a sessão.</p>
            <button type="button" id="btn-sair" class="btn btn-sm btn-secondary">Sair</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/pages/login.js"></script>
</body>
</html>
